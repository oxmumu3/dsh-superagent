name: npm release

# Two manual phases:
#   1. publish=false, github_release=false (default) -> tests, client check,
#      deterministic archive, SHA-256 and a BUILD.json receipt.
#   2. github_release=true (and/or publish=true) with the exact SHA from phase 1 ->
#      attach that verified archive to GitHub Release v<version> and (when publish=true)
#      publish it to npm via OIDC Trusted Publishing with provenance.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "true only after verifying the exact SHA from phase 1"
        type: choice
        options: ["false", "true"]
        default: "false"
      github_release:
        description: "true to publish/verify GitHub Release v<version> with the verified archive"
        type: choice
        options: ["false", "true"]
        default: "false"
      expected_sha:
        description: "SHA-256 of the archive from phase 1 (required when github_release=true or publish=true)"
        type: string
        required: false
      source_tag:
        description: "Optional existing release tag to reuse the previously verified source."
        type: string
        required: false

permissions:
  contents: read

concurrency:
  group: npm-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'oxmumu3/dsh-superagent' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      source_sha: ${{ steps.source.outputs.sha }}
      sha256: ${{ steps.receipt.outputs.sha256 }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          ref: ${{ inputs.source_tag && format('refs/tags/{0}', inputs.source_tag) || github.sha }}
      - id: source
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          if [ -n "$SOURCE_TAG" ]; then
            printf '%s\n' "$SOURCE_TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-preview\.[0-9]+)?$'
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Pin npm for trusted publishing
        run: |
          set -eu
          npm install -g npm@11.15.0
          node --version
          npm --version
      - name: Unit tests
        run: node scripts/run-tests.mjs
      - name: Client bundle check
        run: node scripts/check-client.cjs
      - name: Build deterministic release archive
        run: node scripts/build-preview-package.mjs --out dist
      - id: receipt
        name: Write archive and build receipt
        env:
          BUILD_COMMIT: ${{ steps.source.outputs.sha }}
        run: |
          set -eu
          env -u GITHUB_SHA node scripts/write-build-receipt.mjs dist
          cd dist
          sha256sum ./*.tgz > ARCHIVE.sha256
          cat ARCHIVE.sha256
          echo "sha256=$(awk '{print $1}' ARCHIVE.sha256)" >> "$GITHUB_OUTPUT"
      - id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-archive
          path: dist/
          if-no-files-found: error
          retention-days: 7

  github_release:
    needs: verify
    if: >-
      (inputs.github_release == 'true' || inputs.publish == 'true') &&
      github.repository == 'oxmumu3/dsh-superagent' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
      - name: Verify exact archive, metadata and build receipt
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.sha256 }}
          BUILD_COMMIT: ${{ needs.verify.outputs.source_sha }}
        run: |
          set -eu
          test -n "${EXPECTED_SHA}"
          echo "${EXPECTED_SHA}" | grep -Eq '^[0-9a-f]{64}$'
          actual="$(sha256sum ./dist/*.tgz | awk '{print $1}')"
          test "${EXPECTED_SHA}" = "${actual}"
          test "${VERIFIED_SHA}" = "${actual}"
          tar -xzf ./dist/*.tgz -C dist package/package.json
          node - <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const zlib = require('node:zlib')
          const receipt = JSON.parse(fs.readFileSync('dist/BUILD.json', 'utf8'))
          const manifest = JSON.parse(fs.readFileSync('dist/package/package.json', 'utf8'))
          const archive = fs.readFileSync(`dist/${receipt.archive}`)
          const digest = value => crypto.createHash('sha256').update(value).digest('hex')
          const same = (label, expected, actual) => {
            if (expected !== actual) throw new Error(`${label} differs: ${expected} != ${actual}`)
          }
          same('archive SHA', process.env.EXPECTED_SHA, digest(archive))
          same('receipt archive SHA', process.env.EXPECTED_SHA, receipt.archiveSha256)
          same('uncompressed tar SHA', receipt.tarSha256, digest(zlib.gunzipSync(archive)))
          same('commit', process.env.BUILD_COMMIT, receipt.commit)
          same('package name', '@oxmumu3/dsh-superagent', manifest.name)
          same('package version', receipt.version, manifest.version)
          same('host engine', '>=0.2.2-rc.2 <0.3.0', manifest.engines?.dsh)
          same('receipt host engine', receipt.host, manifest.engines?.dsh)
          same('repository', 'https://github.com/oxmumu3/dsh-superagent', typeof manifest.repository === 'string' ? manifest.repository : manifest.repository?.url)
          if (manifest.private !== false) throw new Error('manifest is still private')
          if (!Array.isArray(manifest.peerDependencies) && manifest.peerDependencies) throw new Error('unexpected peerDependencies')
          console.log(JSON.stringify({ ok: true, version: manifest.version, archiveSha256: receipt.archiveSha256, commit: receipt.commit }))
          NODE
          rm -rf dist/package
      - name: Create or verify GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -eu
          tar -xzf ./dist/*.tgz -C dist package/package.json
          VERSION="$(node -p "require('./dist/package/package.json').version")"
          rm -rf dist/package
          TAG="v${VERSION}"
          actual="$(sha256sum ./dist/*.tgz | awk '{print $1}')"
          if gh release view "${TAG}" >/dev/null 2>&1; then
            remote="$(gh release view "${TAG}" --json assets --jq '.assets[] | select(.name | endswith(".tgz")) | .digest')"
            test "$remote" = "sha256:${actual}"
          else
            EXTRA_FLAGS=""
            NOTES="Verified release archive of @oxmumu3/dsh-superagent v${VERSION} (SHA-256: ${actual})."
            if echo "${VERSION}" | grep -q -- "-"; then
              EXTRA_FLAGS="--prerelease"
              NOTES="Preview candidate. Not a stable release; npm dist-tag: preview. SHA-256: ${actual}."
            fi
            gh release create "${TAG}" ./dist/*.tgz ./dist/ARCHIVE.sha256 ${EXTRA_FLAGS} --title "dsh-superagent ${TAG}" --notes "${NOTES}"
          fi

  publish:
    needs: verify
    if: >-
      inputs.publish == 'true' &&
      github.repository == 'oxmumu3/dsh-superagent' &&
      github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          artifact-ids: ${{ needs.verify.outputs.artifact_id }}
          merge-multiple: true
          path: dist
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24.21.0"
          registry-url: "https://registry.npmjs.org"
      - name: Pin npm for trusted publishing
        run: |
          set -eu
          npm install -g npm@11.15.0
          node --version
          npm --version
      - name: Verify exact archive, metadata and build receipt
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VERIFIED_SHA: ${{ needs.verify.outputs.sha256 }}
          BUILD_COMMIT: ${{ needs.verify.outputs.source_sha }}
        run: |
          set -eu
          test -n "${EXPECTED_SHA}"
          echo "${EXPECTED_SHA}" | grep -Eq '^[0-9a-f]{64}$'
          actual="$(sha256sum ./dist/*.tgz | awk '{print $1}')"
          test "${EXPECTED_SHA}" = "${actual}"
          test "${VERIFIED_SHA}" = "${actual}"
          tar -xzf ./dist/*.tgz -C dist package/package.json
          node - <<'NODE'
          const fs = require('node:fs')
          const crypto = require('node:crypto')
          const zlib = require('node:zlib')
          const receipt = JSON.parse(fs.readFileSync('dist/BUILD.json', 'utf8'))
          const manifest = JSON.parse(fs.readFileSync('dist/package/package.json', 'utf8'))
          const archive = fs.readFileSync(`dist/${receipt.archive}`)
          const digest = value => crypto.createHash('sha256').update(value).digest('hex')
          const same = (label, expected, actual) => {
            if (expected !== actual) throw new Error(`${label} differs: ${expected} != ${actual}`)
          }
          same('archive SHA', process.env.EXPECTED_SHA, digest(archive))
          same('receipt archive SHA', process.env.EXPECTED_SHA, receipt.archiveSha256)
          same('uncompressed tar SHA', receipt.tarSha256, digest(zlib.gunzipSync(archive)))
          same('commit', process.env.BUILD_COMMIT, receipt.commit)
          same('package name', '@oxmumu3/dsh-superagent', manifest.name)
          same('package version', receipt.version, manifest.version)
          same('host engine', '>=0.2.2-rc.2 <0.3.0', manifest.engines?.dsh)
          same('receipt host engine', receipt.host, manifest.engines?.dsh)
          same('repository', 'https://github.com/oxmumu3/dsh-superagent', typeof manifest.repository === 'string' ? manifest.repository : manifest.repository?.url)
          if (manifest.private !== false) throw new Error('manifest is still private')
          if (!Array.isArray(manifest.peerDependencies) && manifest.peerDependencies) throw new Error('unexpected peerDependencies')
          console.log(JSON.stringify({ ok: true, version: manifest.version, archiveSha256: receipt.archiveSha256, commit: receipt.commit }))
          NODE
          rm -rf dist/package
      - name: Publish exact artifact to npm via Trusted Publisher
        run: |
          set -eu
          tar -xzf ./dist/*.tgz -C dist package/package.json
          VERSION="$(node -p "require('./dist/package/package.json').version")"
          rm -rf dist/package
          TAG_FLAGS=""
          if echo "${VERSION}" | grep -q -- "-"; then
            TAG_FLAGS="--tag preview"
          fi
          npm publish ./dist/*.tgz --ignore-scripts --provenance --access public ${TAG_FLAGS}
